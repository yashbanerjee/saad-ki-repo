# Backend-only config at repo root.
# Do NOT point the frontend service at this file.
#
# Frontend service must use:
#   Config file: workspace/frontend/railway.toml
#   Root Directory: workspace/frontend

[build]
builder = "RAILPACK"
buildCommand = "npm run build"

[deploy]
startCommand = "node workspace/backend/scripts/start-railway.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 10
