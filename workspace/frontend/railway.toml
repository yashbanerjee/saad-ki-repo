# Frontend service (Next.js)
#
# Railway Settings (BOTH required):
#   1. Root Directory:        workspace/frontend
#   2. Config-as-code path:   workspace/frontend/railway.toml
#      (NO leading slash — not /workspace/...)
#
# Frontend does NOT need DATABASE_URL.

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run build"

[deploy]
# Explicit Next.js start — never call repo-root npm start
startCommand = "npx next start --hostname 0.0.0.0 --port ${PORT:-3000}"
healthcheckPath = "/"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
