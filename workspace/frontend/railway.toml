# Frontend (Next.js) — TaskFlow
#
# Railway service settings:
#   Config-as-code:  workspace/frontend/railway.toml
#   Root Directory:  LEAVE EMPTY (blank)
#
# These commands always target the frontend folder from the repo root,
# so they cannot accidentally start the Nest backend.

[build]
builder = "RAILPACK"
buildCommand = "node workspace/frontend/railway-build.js"

[deploy]
startCommand = "node workspace/frontend/railway-start.js"
healthcheckPath = "/"
healthcheckTimeout = 120
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
