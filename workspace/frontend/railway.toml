# IMPORTANT: In Railway, set this service Root Directory to:
#   workspace/frontend
#
# Do NOT use the repo root for the frontend service.
# Frontend does NOT need DATABASE_URL.

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run build"

[deploy]
startCommand = "npm run start"
healthcheckPath = "/"
healthcheckTimeout = 30
