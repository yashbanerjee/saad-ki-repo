# Backend service on Railway
# Recommended Root Directory: workspace

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run prisma:generate --workspace=backend && npm run build --workspace=backend"

[deploy]
# Explicit path — do not rely on repo-root npm start
startCommand = "node backend/scripts/start-railway.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 100
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
