# Railway config for the BACKEND service
# In Railway dashboard set: Root Directory = workspace
#
# If you create a separate frontend service, override Start/Build
# commands in the dashboard (see docs/RAILWAY.md).

[build]
builder = "RAILPACK"
buildCommand = "npm install && npm run prisma:generate --workspace=backend && npm run build --workspace=backend"

[deploy]
startCommand = "node backend/scripts/start-railway.js"
healthcheckPath = "/api/v1/health"
healthcheckTimeout = 30
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 5
